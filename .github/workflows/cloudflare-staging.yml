name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-cloudflare
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_RELEASE_CONFIGURED == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging-cloudflare
      url: https://authenticator.toolsforhumanity.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ae97c44fcd31b9289a7455120d2698b2
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:cf
        env:
          VITE_APP_ENV: staging
      - name: Deploy the tested main commit
        run: bunx wrangler deploy --env staging --tag "$RELEASE_COMMIT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
