name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              run: bun run test

            - name: Run linting
              run: bun run lint

            - name: Run type checking
              run: bun run typecheck

            - name: Build project
              run: bun run build

            - name: Install test browsers
              run: bunx playwright install --with-deps chromium webkit

            - name: Browser regression tests
              run: bunx playwright test -c tests/e2e/playwright.config.ts

            - name: Build and smoke-test container
              run: |
                  docker build -t web-authenticator:test .
                  docker run --detach --name authenticator-test -p 127.0.0.1:4195:4173 web-authenticator:test
                  trap 'docker logs authenticator-test; docker rm --force authenticator-test' EXIT
                  # Docker can reset connections before Bun starts accepting requests.
                  curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:4195/ > /dev/null
                  curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4195/api/health/ready > /dev/null
                  status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 'http://127.0.0.1:4195/api/staging-rp?id=invalid')
                  test "$status" = 400
