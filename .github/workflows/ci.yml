name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    ci:
        name: ci (${{ matrix.browser }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      browser: chromium
                    # Linux WebKit stalls on the canvas-backed camera fixture before playback starts.
                    - os: macos-latest
                      browser: webkit
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              run: bun run test

            - name: Run linting
              run: bun run lint

            - name: Run type checking
              run: bun run typecheck

            - name: Build project
              run: bun run build

            - name: Validate Cloudflare deployment bundle
              if: runner.os == 'Linux'
              run: |
                  bun run cf:package
                  bun run cf:check
                  bun run cf:check --env sandbox
                  bun run cf:check --env production

            - name: Install test browsers
              run: bunx playwright install --with-deps ${{ matrix.browser }}

            - name: Browser regression tests
              run: bunx playwright test -c tests/e2e/playwright.config.ts --project=desktop-${{ matrix.browser }}

            - name: Build and smoke-test container
              if: runner.os == 'Linux'
              run: |
                  docker build -t web-authenticator:test .
                  docker run --detach --name authenticator-test -p 127.0.0.1:4195:4173 web-authenticator:test
                  trap 'docker logs authenticator-test; docker rm --force authenticator-test' EXIT
                  # Docker can reset connections before Bun starts accepting requests.
                  curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:4195/ > /dev/null
                  curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4195/api/health/ready > /dev/null
                  status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 'http://127.0.0.1:4195/api/staging-rp?id=invalid')
                  test "$status" = 400
