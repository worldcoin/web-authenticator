name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run linting
              run: bun run lint

            - name: Run type checking
              run: bun run typecheck

            - name: Build project
              run: bun run build

            - name: Run tests
              run: bun test

            - name: Install test browsers
              run: bunx playwright install --with-deps chromium webkit

            - name: Browser regression tests
              run: bunx playwright test -c playwright.integration.config.ts
