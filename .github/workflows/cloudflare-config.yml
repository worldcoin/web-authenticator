name: Cloudflare configuration

on:
  push:
    branches: [main]
    paths:
      - cf-worker-config.json
      - .github/workflows/cloudflare-config.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Plan/apply configuration, read build logs, or retry a failed staging build
        type: choice
        default: plan
        options: [plan, plan-and-apply, build-logs, retry-staging]
      build_id:
        description: Cloudflare build UUID from the failed check's Details link (logs/retry only)
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-configuration
  cancel-in-progress: false

jobs:
  configure:
    if: (github.event_name == 'push' || inputs.mode == 'plan' || inputs.mode == 'plan-and-apply') && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_RELEASE_CONFIGURED == 'true'
    runs-on:
      group: arc-public-large-amd64-runner
    environment: staging-cloudflare
    steps:
      - uses: worldcoin/gh-actions-public/cf-worker-config@4877d8286d7e866849fa9daad49e24491113c8ba
        with:
          worker: web-authenticator-dev
          config: cf-worker-config.json
          mode: ${{ inputs.mode || 'plan-and-apply' }}
          cf_worker_config_ref: 7131811e5162e2a98c29728938ee7ff74d131d0f
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  build-diagnostics:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'build-logs' || inputs.mode == 'retry-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Cloudflare build operation
        run: bun scripts/cloudflare-build-logs.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ae97c44fcd31b9289a7455120d2698b2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILD_ID: ${{ inputs.build_id }}
          CLOUDFLARE_BUILD_ACTION: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
