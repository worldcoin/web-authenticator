name: Cloudflare configuration

on:
  push:
    branches: [main]
    paths:
      - cf-worker-config.json
      - .github/workflows/cloudflare-config.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Plan or apply the main branch deployment configuration
        type: choice
        default: plan
        options: [plan, plan-and-apply]

permissions:
  contents: read

concurrency:
  group: cloudflare-configuration
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-dev
    steps:
      - name: Check GitHub App credentials
        env:
          CF_WORKER_CONFIG_APP_ID: ${{ secrets.CF_WORKER_CONFIG_APP_ID }}
          CF_WORKER_CONFIG_APP_INSTALLATION_ID: ${{ secrets.CF_WORKER_CONFIG_APP_INSTALLATION_ID }}
          CF_WORKER_CONFIG_APP_PRIVATE_KEY: ${{ secrets.CF_WORKER_CONFIG_APP_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CF_WORKER_CONFIG_APP_ID CF_WORKER_CONFIG_APP_INSTALLATION_ID CF_WORKER_CONFIG_APP_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Complete the GitHub App credential bootstrap from infrastructure PR #52175."
              missing=1
            fi
          done
          exit "$missing"

      - name: Create read-only configuration token
        id: config-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CF_WORKER_CONFIG_APP_ID }}
          private-key: ${{ secrets.CF_WORKER_CONFIG_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: |
            gh-actions
            cf-worker-config
          permission-contents: read

      - name: Verify GitHub App installation
        env:
          EXPECTED_INSTALLATION_ID: ${{ secrets.CF_WORKER_CONFIG_APP_INSTALLATION_ID }}
          ACTUAL_INSTALLATION_ID: ${{ steps.config-token.outputs.installation-id }}
        run: |
          if [ "$ACTUAL_INSTALLATION_ID" != "$EXPECTED_INSTALLATION_ID" ]; then
            echo "::error::The GitHub App installation does not match the configured installation."
            exit 1
          fi

      # Public repositories cannot resolve internal actions through a remote uses reference.
      - name: Check out shared Cloudflare action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: worldcoin/gh-actions
          ref: 54326c6ae65ae04bcfed34e937eb32378f4af4db
          token: ${{ steps.config-token.outputs.token }}
          path: .github/actions/gh-actions
          sparse-checkout: cf-worker-config
          persist-credentials: false

      - name: Configure Cloudflare Builds
        uses: ./.github/actions/gh-actions/cf-worker-config
        with:
          worker: web-authenticator-dev
          config: cf-worker-config.json
          mode: ${{ inputs.mode || 'plan-and-apply' }}
          app_ref: main
          cf_worker_config_ref: 1ea76554b50c0fa75e7ac363df3d97b51becdae3
          github_token: ${{ steps.config-token.outputs.token }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTHENTICATOR_RGBNET_URL: ${{ secrets.AUTHENTICATOR_RGBNET_URL }}
