name: IdP related origins

# The IdP's /.well-known/webauthn can change without a change in this repository, so this
# also runs on a schedule. A failure means browsers reject passkeys under that IdP's RP ID
# on our origin: new wallets fail to create and existing shared-RP wallets fail to unlock.
on:
    schedule:
        - cron: "17 */6 * * *"
    pull_request:
        paths:
            - web/lib/passkey-rp.ts
            - scripts/check-related-origins.ts
            - .github/workflows/related-origins.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Check IdP related-origin documents
              run: bun run check:related-origins
